name: Omniversal Knowledge Observatory — Source Ingestion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/observatory-ingest.yml"
      - "OBSERVATORY/SOURCES.json"
      - "OBSERVATORY/scripts/**"
      - "OBSERVATORY/tests/**"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/observatory-ingest.yml"
      - "OBSERVATORY/**"

permissions:
  contents: write

concurrency:
  group: omniversal-observatory-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Discover and preserve source leads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector and run regression tests
        run: |
          python OBSERVATORY/scripts/ingest_feeds.py --self-test
          python -m unittest discover -s OBSERVATORY/tests -v
          python -m json.tool OBSERVATORY/SOURCES.json > /dev/null
          python -m json.tool OBSERVATORY/INGEST-LEAD.schema.json > /dev/null

      - name: Prepare persistent source-review branch
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin automation/observatory-daily-ingest >/dev/null 2>&1; then
            git fetch origin automation/observatory-daily-ingest
            git checkout -B automation/observatory-daily-ingest FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b automation/observatory-daily-ingest origin/main
          fi

      - name: Collect registered source feeds
        if: github.event_name != 'pull_request'
        run: python OBSERVATORY/scripts/ingest_feeds.py

      - name: Remove generated bytecode and publish review branch
        if: github.event_name != 'pull_request'
        run: |
          find OBSERVATORY -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A OBSERVATORY
          if git diff --cached --quiet; then
            echo "No new source leads or diagnostics to archive."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(observatory): archive daily source leads"
            git push origin automation/observatory-daily-ingest
          fi
