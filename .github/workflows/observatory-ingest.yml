name: Omniversal Knowledge Observatory — Source Ingestion

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/observatory-ingest.yml"
      - "OBSERVATORY/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: omniversal-observatory-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Discover and preserve source leads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector and run regression tests
        run: |
          python OBSERVATORY/scripts/ingest_feeds.py --self-test
          python -m unittest discover -s OBSERVATORY/tests -v
          python -m json.tool OBSERVATORY/SOURCES.json > /dev/null

      - name: Collect registered source feeds
        if: github.event_name != 'pull_request'
        run: python OBSERVATORY/scripts/ingest_feeds.py

      - name: Open or update source-ingestion pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/observatory-daily-ingest
          delete-branch: false
          commit-message: "chore(observatory): archive daily source leads"
          title: "Automated Observatory source-ingest update"
          body: |
            Automated daily discovery-feed accession.

            - Preserves source title, canonical URL, feed lineage, publication metadata, and metadata hash.
            - Feed entries are leads only; no claim is marked verified.
            - Copyrighted article bodies are not copied.
            - Feed failures are recorded in the daily diagnostics.
            - Human review is required before creating a full discovery accession.
